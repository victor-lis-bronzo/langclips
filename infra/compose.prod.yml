services:
  redis:
    image: redis:8.8.0-alpine
    container_name: langclips-redis
    command: sh -c "redis-server --requirepass $${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes"
    env_file:
      - ./redis.env
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: ghcr.io/victor-lis-bronzo/langclips-api:${IMAGE_TAG:-latest}
    container_name: langclips-api
    env_file:
      - ./api.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
      - proxy-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3333/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    image: ghcr.io/victor-lis-bronzo/langclips-worker:${IMAGE_TAG:-latest}
    container_name: langclips-worker
    env_file:
      - ./worker.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    tmpfs:
      - /tmp:size=512m
    stop_grace_period: 120s
    restart: unless-stopped

volumes:
  redis_data:

networks:
  internal:
    driver: bridge
  proxy-network:
    external: true
