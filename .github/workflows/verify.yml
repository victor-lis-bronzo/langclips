name: Verify

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [api, web, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          project: ${{ matrix.project }}

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: pnpm run lint

      - name: Typecheck
        working-directory: ${{ matrix.project }}
        run: pnpm run typecheck

      - name: Test
        working-directory: ${{ matrix.project }}
        run: pnpm run test

      - name: Build
        working-directory: ${{ matrix.project }}
        env:
          VITE_API_URL: https://dummy.invalid
        run: pnpm run build

      # `api`'s test:e2e is intentionally not run here yet: it hangs today because
      # test/app.e2e-spec.ts boots the full AppModule (real BullMQ connection) without
      # a Redis service container and without closing that connection in teardown, so
      # app.close() never resolves. Needs a Redis service + BullMQ teardown fix first
      # (see docs/deploy.md, "O que foi deliberadamente deixado de fora") — enabling
      # it as-is would hang this job until its timeout instead of failing fast.

  e2e:
    name: E2E (web)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          project: web

      - name: Install Playwright Browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps

      - name: Run E2E Tests
        working-directory: web
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
