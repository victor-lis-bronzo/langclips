name: Setup Node and pnpm
description: Instala pnpm, Node.js (via .nvmrc), configura cache e instala dependências travadas
inputs:
  project:
    description: Subdiretório do app (api, web ou worker)
    required: true
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: ${{ inputs.project }}/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.project }}
      run: pnpm install --frozen-lockfile
